name: Update stock prices

on:
  schedule:
    # 21:30 UTC, lunes a viernes (después del cierre del mercado de EE.UU.)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest prices
        run: python scripts/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore: update stock prices $(date -u +%Y-%m-%d)"
            git push
          fi
